<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Reset Password</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/forgot_password.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="password-wrapper">
        <h2 class="password-title">Reset Password</h2>

        <div class="error-box" id="errorBox"></div>

        <form id="resetForm" method="POST" class="password-form">
            <label>New Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter new password">

            <label>Confirm New Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="Confirm new password">

            <button type="submit" class="password-btn">Reset Password</button>
        </form>

        <div class="extras">
            <a href="/login">Back to Login</a>
        </div>
    </div>

    <script>
        // Set the form action to include the token from the URL
        const token = window.location.pathname.split('/reset-password/')[1];
        document.getElementById('resetForm').action = `/reset-password/${token}`;

        const params = new URLSearchParams(window.location.search);
        const errorBox = document.getElementById('errorBox');

        if (params.get('error') === 'mismatch') {
            errorBox.textContent = 'Passwords do not match.';
            errorBox.classList.add('show');
        } else if (params.get('error') === 'tooshort') {
            errorBox.textContent = 'Password must be at least 6 characters.';
            errorBox.classList.add('show');
        } else if (params.get('error')) {
            errorBox.textContent = 'Something went wrong. Please try again.';
            errorBox.classList.add('show');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Forgot Password</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/forgot_password.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="password-wrapper">
        <h2 class="password-title">Forgot Password</h2>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>

        <form action="/forgot-password" method="POST" class="password-form">
            <label>Email Address</label>
            <input type="text" name="email" required placeholder="Enter your account email">

            <button type="submit" class="password-btn">Send Reset Link</button>
        </form>

        <div class="extras">
            <a href="/login">Back to Login</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const successBox = document.getElementById('successBox');
        const errorBox = document.getElementById('errorBox');

        if (params.get('sent') === '1') {
            successBox.textContent = 'If that email is registered, a reset link has been sent. Check your inbox.';
            successBox.classList.add('show');
        } else if (params.get('error') === 'expired') {
            errorBox.textContent = 'That reset link has expired. Please request a new one.';
            errorBox.classList.add('show');
        } else if (params.get('error')) {
            errorBox.textContent = 'Something went wrong. Please try again.';
            errorBox.classList.add('show');
        }
    </script>
</body>
</html>

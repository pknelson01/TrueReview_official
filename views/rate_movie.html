<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Rate Movie</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/rate_movie.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="hamburger-btn" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="/dashboard" class="mobile-logo">TrueReview</a>
    </div>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/dashboard" id="mobile-dashboard-tab">Dashboard</a>
        <a href="/watched">Watched</a>
        <a href="/watchlist">Watchlist</a>
        <a href="/add-movie">Search</a>
        <span>Following (coming soon...)</span>
        <span>Top-N (coming soon...)</span>
        <form action="/logout" method="POST" style="margin:0;">
            <button type="submit" class="mobile-logout">Logout</button>
        </form>
    </div>

    <div class="header-container">
        <div class="header-bar">
            <div class="logo-section">
                <a href="/dashboard" class="logo">TrueReview</a>
            </div>
            <div class="center-info">
                <div class="site-title">Film Analysis Platform</div>
                <div class="header-search">
                    <a href="/add-movie" class="search-btn">Search</a>
                </div>
                <!-- <div class="status-text">SYSTEM: ONLINE</div> -->
            </div>
            <div class="status-section">
                <form action="/logout" method="POST">
                    <button class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <div class="tab-bar">
            <span class="tab">FOLLOWING (coming soon...)</span>
            <a href="/watched" class="tab">WATCHED</a>
            <a href="/watchlist" class="tab">WATCHLIST</a>
            <span class="tab">TOP-N (coming soon...)</span>
            <a href="/dashboard" class="tab" id="dashboard-tab"></a>
        </div>
    </div>

    <div class="rate-container">
        <h1 class="rate-title">Rate This Movie</h1>

        <div class="movie-section">
            <img id="movie-poster" class="poster" src="" alt="Poster" />
            <div class="movie-info">
                <h2 id="movie-title" class="title"></h2>
                <p id="movie-year" class="year"></p>
            </div>
        </div>

        <form id="rate-form" method="POST">
            <label for="rating">Your Rating (0.0 - 10.0):</label>
            <div class="rating-value" id="rating-display">5.0</div>
            <input
                type="range"
                id="rating"
                name="rating"
                min="0"
                max="10"
                step="0.1"
                value="5.0"
                required
            />

            <label for="review">Review (optional):</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <button type="submit" class="submit-btn">Submit</button>
            <button type="button" class="watchlist-btn" id="watchlist-btn">Add to Watchlist</button>
        </form>
    </div>

    <script>
    // Extract movie ID from URL
    const movieId = window.location.pathname.split("/").pop();

    // Set form action immediately
    document.getElementById("rate-form").action = `/add-movie/${movieId}`;

    // Load movie details
    async function loadMovie() {
        try {
            const res = await fetch(`/api/movie/${movieId}`);

            if (!res.ok) {
                const error = await res.json();
                console.error("Movie not found:", error);
                alert("Failed to load movie details. Please try again.");
                return;
            }

            const movie = await res.json();

            const posterImg = document.getElementById("movie-poster");
            posterImg.src = movie.poster_full_url;
            posterImg.onerror = () => { posterImg.src = '/TrueReview_logo/Poster_BW.png'; };
            document.getElementById("movie-title").textContent = movie.movie_title;
            document.getElementById("movie-year").textContent = movie.releaseYear;
        } catch (err) {
            console.error("Error loading movie:", err);
            alert("Failed to load movie details. Please try again.");
        }
    }

    loadMovie();

    // Update rating display as slider moves
    const ratingSlider = document.getElementById("rating");
    const ratingDisplay = document.getElementById("rating-display");

    ratingSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value).toFixed(1);
        ratingDisplay.textContent = value;
    });

    // Validate rating to one decimal place
    document.getElementById("rate-form").addEventListener("submit", (e) => {
        const ratingInput = document.getElementById("rating");
        const rating = parseFloat(ratingInput.value);

        // Check if rating is valid
        if (isNaN(rating) || rating < 0 || rating > 10) {
            e.preventDefault();
            alert("Please enter a rating between 0.0 and 10.0");
            return;
        }

        // Round to one decimal place
        const rounded = Math.round(rating * 10) / 10;
        ratingInput.value = rounded;
    });

    // Update dashboard tab with username
    async function updateDashboardTab() {
        try {
            const res = await fetch("/api/user/username");
            const data = await res.json();
            document.getElementById("dashboard-tab").textContent = data.display_name.toUpperCase();
        } catch (err) {
            console.error("Error loading username:", err);
        }
    }
    updateDashboardTab();

    // Check if movie is already in watchlist and update button accordingly
    let isInWatchlist = false;
    async function checkWatchlistStatus() {
        try {
            const res = await fetch(`/api/watchlist/check/${movieId}`);
            const data = await res.json();

            isInWatchlist = data.inWatchlist;
            const watchlistBtn = document.getElementById("watchlist-btn");

            if (watchlistBtn) {
                if (isInWatchlist) {
                    watchlistBtn.textContent = "Remove from Watchlist";
                    watchlistBtn.classList.add("remove-mode");
                } else {
                    watchlistBtn.textContent = "Add to Watchlist";
                    watchlistBtn.classList.remove("remove-mode");
                }
            }
        } catch (err) {
            console.error("Error checking watchlist status:", err);
        }
    }
    checkWatchlistStatus();

    // Add/Remove watchlist functionality
    document.getElementById("watchlist-btn").addEventListener("click", async () => {
        try {
            if (isInWatchlist) {
                // Remove from watchlist
                const res = await fetch(`/api/watchlist/${movieId}`, {
                    method: "DELETE"
                });

                if (!res.ok) {
                    const error = await res.json();
                    console.error("Failed to remove from watchlist:", error.error);
                    return;
                }

                console.log("Removed from watchlist");
                // Redirect to watchlist page
                window.location.href = "/watchlist";
            } else {
                // Add to watchlist
                const res = await fetch("/api/watchlist/add", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ movie_id: movieId, priority_01: 0 })
                });

                if (!res.ok) {
                    const error = await res.json();
                    console.error("Failed to add to watchlist:", error.error);
                    return;
                }

                console.log("Added to watchlist");
                // Redirect to watchlist page
                window.location.href = "/watchlist";
            }
        } catch (err) {
            console.error("Error with watchlist:", err);
        }
    });
    </script>
    <script>
        // Hamburger menu toggle
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburgerBtn && mobileMenu) {
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
            // Close menu when a link is clicked
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                });
            });
        }
        // Update mobile dashboard tab with display name
        async function updateMobileDashboardTab() {
            try {
                const res = await fetch("/api/user/username");
                const data = await res.json();
                const el = document.getElementById("mobile-dashboard-tab");
                if (el) el.textContent = data.display_name.toUpperCase();
            } catch (err) {}
        }
        updateMobileDashboardTab();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Login</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="login-wrapper">
        <h2 class="login-title">Login</h2>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>

        <form action="/login" method="POST" class="login-form">
            <label>Email</label>
            <input type="text" name="email" required placeholder="Enter your email">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="/guest-login" class="guest-btn">Continue as Guest</a>

        <div class="extras">
            <a href="/forgot-password">Forgot Password?</a>
            <span style="margin: 0 10px; color: var(--steel);">|</span>
            <a href="/">Back to Home</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const errorBox = document.getElementById('errorBox');
        if (error === 'invalid_email') {
            errorBox.textContent = 'Please enter a valid email address.';
            errorBox.classList.add('show');
        } else if (error === 'deactivated') {
            errorBox.innerHTML = 'This account has been deactivated. To appeal, visit <a href="https://portfolio-g8ht.onrender.com/" target="_blank" style="color:inherit;font-weight:bold;">my portfolio</a> and click Contact.';
            errorBox.classList.add('show');
        } else if (error) {
            errorBox.textContent = 'Incorrect email or password.';
            errorBox.classList.add('show');
        }
        const successBox = document.getElementById('successBox');
        if (params.get('reset') === '1') {
            successBox.textContent = 'Password reset successfully. You can now log in.';
            successBox.classList.add('show');
        }
    </script>
</body>
</html>

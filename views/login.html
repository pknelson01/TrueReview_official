<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Login</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="login-wrapper">
        <h2 class="login-title">Login</h2>

        <div class="error-box" style="display:none;">Invalid login</div>

        <form action="/login" method="POST" class="login-form">
            <label>Email</label>
            <input type="text" name="email" required placeholder="Enter your email">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="/guest-login" class="guest-btn">Continue as Guest</a>

        <div class="extras">
            <a href="/">Back to Home</a>
        </div>
    </div>
</body>
</html>

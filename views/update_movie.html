<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Update Movie Review</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/update_movie.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- Custom Confirmation Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <div class="modal-title">Confirm Action</div>
            <div class="modal-message">
                Are you sure? This will delete your entry and review.
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-yes" id="modal-yes">Yes, I'm Sure</button>
                <button class="modal-btn modal-btn-no" id="modal-no">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="hamburger-btn" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="/dashboard" class="mobile-logo">TrueReview</a>
    </div>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/dashboard" id="mobile-dashboard-tab">Dashboard</a>
        <a href="/watched">Watched</a>
        <a href="/watchlist">Watchlist</a>
        <a href="/add-movie">Search</a>
        <span>Following (coming soon...)</span>
        <span>Top-N (coming soon...)</span>
        <form action="/logout" method="POST" style="margin:0;">
            <button type="submit" class="mobile-logout">Logout</button>
        </form>
    </div>

    <div class="header-container">
        <div class="header-bar">
            <div class="logo-section">
                <a href="/dashboard" class="logo">TrueReview</a>
            </div>
            <div class="center-info">
                <div class="site-title">Film Analysis Platform</div>
                <div class="header-search">
                    <a href="/add-movie" class="search-btn">Search</a>
                </div>
                <!-- <div class="status-text">SYSTEM: ONLINE</div> -->
            </div>
            <div class="status-section">
                <form action="/logout" method="POST">
                    <button class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <div class="tab-bar">
            <span class="tab">FOLLOWING (coming soon...)</span>
            <a href="/watched" class="tab">WATCHED</a>
            <a href="/watchlist" class="tab">WATCHLIST</a>
            <span class="tab">TOP-N (coming soon...)</span>
            <a href="/dashboard" class="tab" id="dashboard-tab"></a>
        </div>
    </div>

    <div class="update-container">
        <h1 class="update-title">Update Your Review</h1>

        <div class="movie-section">
            <img id="movie-poster" class="poster" src="" alt="Poster" />
            <div class="movie-info">
                <h2 id="movie-title"></h2>
                <p id="movie-year"></p>
            </div>
        </div>

        <form id="update-form" method="POST">
            <label for="rating">Your Rating (0.0 - 10.0):</label>
            <div class="rating-value" id="rating-display">5.0</div>
            <input
                type="range"
                id="rating"
                name="rating"
                min="0"
                max="10"
                step="0.1"
                value="5.0"
                required
            />

            <label for="review">Review (optional):</label>
            <textarea id="review" name="review" rows="5"></textarea>

            <button type="submit" class="submit-btn">Update</button>
            <button type="button" class="watchlist-btn" id="watchlist-btn">Move to Watchlist</button>
        </form>

        <form id="delete-form" method="POST">
            <button type="submit" class="delete-btn">Delete Entry</button>
        </form>
    </div>

    <script src="/public/js/update_movie.js"></script>
    <script>
        // watchedId is already declared in update_movie.js

        // Update dashboard tab with username
        async function updateDashboardTab() {
            try {
                const res = await fetch("/api/user/username");
                const data = await res.json();
                document.getElementById("dashboard-tab").textContent = data.display_name.toUpperCase();
            } catch (err) {
                console.error("Error loading username:", err);
            }
        }
        updateDashboardTab();

        // Custom modal function
        function showConfirmModal() {
            return new Promise((resolve) => {
                const modal = document.getElementById("confirm-modal");
                const yesBtn = document.getElementById("modal-yes");
                const noBtn = document.getElementById("modal-no");

                // Show modal
                modal.classList.add("active");

                // Handle Yes button
                const handleYes = () => {
                    modal.classList.remove("active");
                    yesBtn.removeEventListener("click", handleYes);
                    noBtn.removeEventListener("click", handleNo);
                    resolve(true);
                };

                // Handle No button
                const handleNo = () => {
                    modal.classList.remove("active");
                    yesBtn.removeEventListener("click", handleYes);
                    noBtn.removeEventListener("click", handleNo);
                    resolve(false);
                };

                yesBtn.addEventListener("click", handleYes);
                noBtn.addEventListener("click", handleNo);

                // Close on overlay click
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) {
                        handleNo();
                    }
                });
            });
        }

        // Add to watchlist functionality (move from watched to watchlist)
        const watchlistBtn = document.getElementById("watchlist-btn");

        if (watchlistBtn) {
            watchlistBtn.addEventListener("click", async () => {
                // Show custom modal instead of browser confirm
                const confirmed = await showConfirmModal();
                if (!confirmed) return;

                try {
                    // Get movie_id from the watched entry
                    const watchedRes = await fetch(`/api/watched/${watchedId}`);

                    if (!watchedRes.ok) {
                        console.error("Failed to get movie details");
                        return;
                    }
                    const watchedData = await watchedRes.json();
                    const movieId = watchedData.movie_id;

                    // Move to watchlist
                    const res = await fetch("/api/watchlist/move-from-watched", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ watched_id: watchedId, movie_id: movieId })
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        console.error("Failed to move to watchlist:", error);
                        return;
                    }

                    window.location.href = "/watchlist";
                } catch (err) {
                    console.error("Error moving to watchlist:", err);
                }
            });
        }

        // Validate rating to one decimal place
        document.getElementById("update-form").addEventListener("submit", (e) => {
            const ratingInput = document.getElementById("rating");
            const rating = parseFloat(ratingInput.value);

            // Check if rating is valid
            if (isNaN(rating) || rating < 0 || rating > 10) {
                e.preventDefault();
                alert("Please enter a rating between 0.0 and 10.0");
                return;
            }

            // Round to one decimal place
            const rounded = Math.round(rating * 10) / 10;
            ratingInput.value = rounded;
        });
    </script>
    <script>
        // Hamburger menu toggle
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburgerBtn && mobileMenu) {
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
            // Close menu when a link is clicked
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                });
            });
        }
        // Update mobile dashboard tab with display name
        async function updateMobileDashboardTab() {
            try {
                const res = await fetch("/api/user/username");
                const data = await res.json();
                const el = document.getElementById("mobile-dashboard-tab");
                if (el) el.textContent = data.display_name.toUpperCase();
            } catch (err) {}
        }
        updateMobileDashboardTab();
    </script>
</body>
</html>

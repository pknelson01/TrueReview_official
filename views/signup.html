<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Sign Up</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/signup.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="signup-wrapper">
        <h2 class="signup-title">Sign Up</h2>

        <div class="error-box" id="errorBox"></div>

        <form action="/signup" method="POST" class="signup-form" onsubmit="return validateForm()">
            <label>Username</label>
            <input type="text" name="username" id="username" required placeholder="Enter your username" maxlength="20">

            <label>Display Name</label>
            <input type="text" name="display_name" id="display_name" required placeholder="Enter your display name" maxlength="20">

            <label>Email</label>
            <input type="text" name="email" id="email" required placeholder="Enter your email">

            <label>Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">

            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="Confirm your password">

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="extras">
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>

    <script>
        function validateForm() {
            const username = document.getElementById('username').value;
            const displayName = document.getElementById('display_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorBox = document.getElementById('errorBox');

            // Validate username (no spaces, alphanumeric only, max 20 chars)
            const usernameRegex = /^[a-zA-Z0-9]{1,20}$/;
            if (!usernameRegex.test(username)) {
                errorBox.textContent = 'Username must be alphanumeric only, no spaces, max 20 characters';
                errorBox.classList.add('show');
                return false;
            }

            // Validate display name (letters and numbers only, max 20 chars)
            const displayNameRegex = /^[a-zA-Z0-9]{1,20}$/;
            if (!displayNameRegex.test(displayName)) {
                errorBox.textContent = 'Display name must be letters and numbers only, max 20 characters';
                errorBox.classList.add('show');
                return false;
            }

            // Validate email format
            if (!email.includes('@') || !email.includes('.com')) {
                errorBox.textContent = 'Email must contain @ and .com';
                errorBox.classList.add('show');
                return false;
            }

            // Check if passwords match
            if (password !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match';
                errorBox.classList.add('show');
                return false;
            }

            return true;
        }

        // Show error from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorBox = document.getElementById('errorBox');

        if (error === 'email_exists') {
            errorBox.textContent = 'This email is already registered';
            errorBox.classList.add('show');
        } else if (error === 'username_exists') {
            errorBox.textContent = 'This username is already taken';
            errorBox.classList.add('show');
        } else if (error === 'invalid_email') {
            errorBox.textContent = 'Email must contain @ and .com';
            errorBox.classList.add('show');
        } else if (error === 'invalid_username') {
            errorBox.textContent = 'Username must be alphanumeric only, no spaces, max 20 characters';
            errorBox.classList.add('show');
        } else if (error === 'invalid_display_name') {
            errorBox.textContent = 'Display name must be letters and numbers only, max 20 characters';
            errorBox.classList.add('show');
        }
    </script>
</body>
</html>

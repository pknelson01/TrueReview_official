<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueReview - Edit Profile</title>
    <link rel="icon" href="../TrueReview_logo/Icon_BW.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/public/css/edit_profile.css">
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="hamburger-btn" id="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="/dashboard" class="mobile-logo">TrueReview</a>
    </div>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/dashboard" id="mobile-dashboard-tab">Dashboard</a>
        <a href="/watched">Watched</a>
        <a href="/watchlist">Watchlist</a>
        <a href="/add-movie">Search</a>
        <span>Following (coming soon...)</span>
        <span>Top-N (coming soon...)</span>
        <form action="/logout" method="POST" style="margin:0;">
            <button type="submit" class="mobile-logout">Logout</button>
        </form>
    </div>

    <div class="header-container">
        <div class="header-bar">
            <div class="logo-section">
                <a href="/dashboard" class="logo">TrueReview</a>
            </div>
            <div class="center-info">
                <div class="site-title">Film Analysis Platform</div>
                <div class="header-search">
                    <a href="/add-movie" class="search-btn">Search</a>
                </div>
                <!-- <div class="status-text">SYSTEM: ONLINE</div> -->
            </div>
            <div class="status-section">
                <form action="/logout" method="POST">
                    <button class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <div class="tab-bar">
            <span class="tab">FOLLOWING (coming soon...)</span>
            <a href="/watched" class="tab">WATCHED</a>
            <a href="/watchlist" class="tab">WATCHLIST</a>
            <span class="tab">TOP-N (coming soon...)</span>
            <a href="/dashboard" class="tab" id="dashboard-tab"></a>
        </div>
    </div>

    <div class="main-content">
        <div class="profile-section">
            <div class="profile-header">
                <div class="profile-label">Edit Profile</div>
            </div>
            <div class="profile-body">
                <div class="profile-picture-container">
                    <div class="profile-picture" onclick="triggerFileInput('pfp-input'); event.stopPropagation();">
                        <span id="profile-initials"></span>
                        <img id="profile-pic" style="display:none;" />
                        <div class="edit-overlay">
                            <i class="fa-solid fa-pencil"></i>
                        </div>
                    </div>
                    <input id="pfp-input" type="file" accept="image/*" style="display:none;">
                </div>

                <form id="edit-form" action="/update-profile" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-input" required maxlength="20">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="display_name">Display Name</label>
                        <input type="text" id="display_name" name="display_name" class="form-input" required maxlength="20">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="title">Title</label>
                        <input type="text" id="title" name="title" class="form-input" placeholder="e.g. Film Enthusiast">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="bio">Bio</label>
                        <textarea id="bio" name="bio" class="form-textarea" placeholder="Tell us about yourself..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="favorite_movie">Favorite Movie</label>
                        <select id="favorite_movie" name="favorite_movie" class="form-select">
                            <option value="">Select a favorite movie</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="save-btn">Save Changes</button>
                        <a href="/dashboard" class="cancel-btn">Cancel</a>
                    </div>
                </form>

                <div class="button-group" style="margin-top: 20px;">
                    <a href="/change-password" class="cancel-btn">Change Password</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function triggerFileInput(id) {
            document.getElementById(id).click();
        }

        // Upload new profile picture
        document.getElementById("pfp-input").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            const res = await fetch("/api/upload/profile-picture", {
                method: "POST",
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                const img = document.getElementById("profile-pic");
                img.src = `/uploads/profile_pictures/${data.filename}`;
                img.style.display = "block";
                document.getElementById("profile-initials").style.display = "none";
            }
        });

        // Load current profile data
        async function loadProfile() {
            const res = await fetch("/api/dashboard");
            const data = await res.json();

            // Set profile picture
            if (data.user.profile_picture) {
                const img = document.getElementById("profile-pic");
                img.src = `/uploads/profile_pictures/${data.user.profile_picture}`;
                img.style.display = "block";
                document.getElementById("profile-initials").style.display = "none";
            } else {
                const initials = data.user.display_name.substring(0, 2).toUpperCase();
                document.getElementById("profile-initials").textContent = initials;
            }

            // Set form values
            document.getElementById("username").value = data.user.username || "";
            document.getElementById("display_name").value = data.user.display_name || "";
            document.getElementById("title").value = data.user.title || "";
            document.getElementById("bio").value = data.user.bio || "";

            // Update dashboard tab with display_name
            document.getElementById("dashboard-tab").textContent = data.user.display_name.toUpperCase();

            // Load watched movies for favorite selection
            const watchedRes = await fetch("/api/watched");
            const movies = await watchedRes.json();

            const select = document.getElementById("favorite_movie");
            movies.forEach(movie => {
                const option = document.createElement("option");
                option.value = movie.movie_id;
                option.textContent = movie.movie_title;
                if (data.user.favorite_movie && data.user.favorite_movie == movie.movie_id) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        loadProfile();
    </script>
    <script>
        // Hamburger menu toggle
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburgerBtn && mobileMenu) {
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
            // Close menu when a link is clicked
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                });
            });
        }
        // Update mobile dashboard tab with display name
        async function updateMobileDashboardTab() {
            try {
                const res = await fetch("/api/user/username");
                const data = await res.json();
                const el = document.getElementById("mobile-dashboard-tab");
                if (el) el.textContent = data.display_name.toUpperCase();
            } catch (err) {}
        }
        updateMobileDashboardTab();
    </script>
</body>
</html>
